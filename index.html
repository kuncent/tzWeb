    <style>
      /* ―― 首屏 loading 角标：只标「舞台还没在画」，不挡页面 ――
         为什么内联在这里而不是做一个 React 组件：要盖的正是「React 自己的第一帧」
         （入口 JS 的解析 + 首次提交），挂在 React 里就等于让 loading 等自己。
         零依赖、零请求：进 HTML 就已在屏上。
         为什么不是全屏黑幕（上一版是）：黑幕把已经加载好的导航、大标题、看板一起
         盖掉了 —— 而用户要的是「页面先出来，只有那块 3D 舞台在加载」。所以这是一枚
         不占排版的胶囊：pointer-events:none，页面从头到尾可读可点。
         字体不写 Inter（它还在路上），直接用系统里就在的那一档 */
      html {
        background: #06080d;
        /* 声明暗色 color-scheme：让浏览器在样式表/布局之前的最早那一帧就把
           默认画布选成暗色，而不先铺一层白——与上面的暗底一起把“白屏闪过”彻底堵掉 */
        color-scheme: dark;
      }
      #boot {
        position: fixed;
        left: 50%;
        bottom: 15%;
        transform: translateX(-50%);
        z-index: 2147483000;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 18px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        background: rgba(6, 8, 13, 0.62);
        color: rgba(255, 255, 255, 0.72);
        pointer-events: none;
        font-family: 'HarmonyOS Sans SC', 'Source Han Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        transition: opacity 0.55s ease 0.05s;
      }
      #boot.boot-gone {
        opacity: 0;
      }
      /* 进度条是不确定的（真的不知道还要多久，骗人的百分比比不给更糟）：
         一段亮条在胶囊底边 2px 轨道上来回扫，读作“在做事”而不是“卡在 30%” */
      #boot .bt-bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 2px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.09);
      }
      #boot .bt-bar i {
        position: absolute;
        inset: 0 auto 0 0;
        width: 42%;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, #1677ff 45%, #6ec6ff);
        animation: bt-sweep 1.25s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      #boot .bt-tip {
        font-size: 12px;
        letter-spacing: 0.05em;
        white-space: nowrap;
      }
      @keyframes bt-sweep {
        0% {
          transform: translateX(-105%);
        }
        100% {
          transform: translateX(245%);
        }
      }
      /* 要求减弱动效的人：给静帧，不要拿着一条来回扫的亮条 */
      @media (prefers-reduced-motion: reduce) {
        #boot .bt-bar i {
          width: 100%;
          animation: none;
          transform: none;
          opacity: 0.5;
        }
      }

      /* ============================================================
       * 开屏遮挡页：白底 + 中央「六节点装配」动画 + 圆形扩散揭开
       * ------------------------------------------------------------
       * 为什么写在 index.html 内联而不是 React 组件：它要盖住的正是
       * 「入口 JS、字体、3D chunk 都还没到」那一段 —— 挂在 React 里
       * 等于让遮罩等自己。零依赖、零请求，进 HTML 就已在屏上。
       * 视觉：白色画布 + 极淡品牌蓝光晕与网格；中央六边形是品牌徽标轮廓，
       * 节点依次点亮，Z 字标最后落笔；外圈刻度与两段弧缓慢
       * 反向旋转，读作「系统在接入」。收口时中央内容先缩小淡出，再让
       * 孔径从六边形自身的轮廓起跳，保持六边形形状向外扩散到盖住四角 ——
       * 页面从中心动画的轮廓里长出来，而不是从一个小圆点捅开。
       * 只在首页演；后台/内页/预览/减弱动效由 data-intro-off 直接隐藏。
       * ============================================================ */
      html[data-intro-off] #intro {
        display: none !important;
      }

      #intro {
        position: fixed;
        inset: 0;
        z-index: 2147483001;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        /* 白幕本身交给下面那层内联 SVG 的 rect：只有它带 mask，孔径才能是六边形。
           这里留透明底，不然自己的白底会把孔径挡住 */
        background: transparent;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        font-family: Inter, 'HarmonyOS Sans SC', 'Source Han Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      }

      /* ―― 白幕 + 孔径：一块 100% 白 rect，被 mask 里一枚可缩放的黑六边形挖空 ――
         六边形在这里就是“中心动画的轮廓”：收口时孔径从标记本身的六边形尺寸起跳，
         保持轮廓形状放大到盖住四角，页面从六边形里面长出来。
         描边两条：1.4px 的渐变轮廓 + 14px 的低透明度青光，跟随孔径一起走，
         用 non-scaling-stroke 让线宽在放大时不跟着变粗。 */
      #intro .it-wipe {
        position: absolute;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: hidden;
      }
      #intro .it-curtain {
        fill: #fff;
      }
      #intro .it-hole {
        will-change: transform;
      }
      #intro .it-outline,
      #intro .it-outline-glow {
        fill: none;
        opacity: 0;
        will-change: transform, opacity;
      }
      #intro .it-outline {
        stroke: url(#itEdge);
        stroke-width: 1.2;
        vector-effect: non-scaling-stroke;
      }
      #intro .it-outline-glow {
        stroke: rgba(37, 212, 255, 0.24);
        stroke-width: 12;
        vector-effect: non-scaling-stroke;
      }

      /* ―― 背景：中心一团很淡的品牌蓝，四周收白；一层几乎看不见的网格给技术感 ――
         这两层都是近乎白色的柔光/网纹，收口时先淡掉，
         否则会盖在六边形孔径上，把下面露出的页面糊住 */
      #intro .it-bg {
        position: absolute;
        transition: opacity 0.21s ease;
        inset: 0;
        background:
          radial-gradient(52% 42% at 50% 44%, rgba(22, 119, 255, 0.075), rgba(22, 119, 255, 0.022) 42%, transparent 72%),
          linear-gradient(180deg, #ffffff 0%, #ffffff 58%, #fbfcff 100%);
      }
      #intro .it-grid {
        position: absolute;
        inset: 0;
        opacity: 0.7;
        transition: opacity 0.28s ease;
        background-image:
          linear-gradient(to right, rgba(11, 15, 23, 0.028) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(11, 15, 23, 0.028) 1px, transparent 1px);
        background-size: 58px 58px;
        -webkit-mask-image: radial-gradient(58% 54% at 50% 45%, #000 0%, transparent 78%);
        mask-image: radial-gradient(58% 54% at 50% 45%, #000 0%, transparent 78%);
      }

      /* ―― 中央组：舞台 + 字标 + 进度线；收口时整组缩小淡出 ―― */
      #intro .it-center {
        position: relative;
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        will-change: transform, opacity;
      }
      /* 舞台放大了一档：它是访客看到的第一件东西，此前 300px 的盘面里
         六边形字标只有 100px 宽。现在取 min(68vw, 45vh) —— 桌面 1440×900
         约 405px、移动端贴着 68vw 走，短屏由下面的 max-height 媒体查询兜底 */
      #intro .it-stage {
        position: relative;
        width: clamp(272px, min(68vw, 45vh), 480px);
        aspect-ratio: 1;
        display: grid;
        place-items: center;
      }

      /* 旋转刻度环（半径 0.5W，inset 0）：40 枚短齿，只留最外侧 6px 环带 */
      #intro .it-ticks {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: repeating-conic-gradient(
          from 0deg,
          rgba(22, 119, 255, 0.24) 0deg 0.8deg,
          transparent 0.8deg 9deg
        );
        -webkit-mask: radial-gradient(closest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
        mask: radial-gradient(closest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
        will-change: transform;
        animation: it-spin 44s linear infinite;
      }
      /* 最外层那圈静态发丝圆（半径 0.535W，inset -7%，1px solid @6%）已整圈删除：
         它只负责压白底边界，去掉后构图正好收在旋转刻度环上，不再为它留环带 */
      #intro .it-arc {
        position: absolute;
        inset: 11%;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          rgba(34, 211, 238, 0),
          rgba(34, 211, 238, 0.5) 20%,
          rgba(22, 119, 255, 0.14) 38%,
          rgba(22, 119, 255, 0) 52%,
          rgba(22, 119, 255, 0) 100%
        );
        -webkit-mask: radial-gradient(closest-side, transparent calc(100% - 2px), #000 calc(100% - 1px));
        mask: radial-gradient(closest-side, transparent calc(100% - 2px), #000 calc(100% - 1px));
        will-change: transform;
        animation: it-spin 5.6s linear infinite;
      }
      #intro .it-arc.b {
        inset: 22%;
        opacity: 0.55;
        animation-duration: 8.2s;
        animation-direction: reverse;
      }
      /* 两颗卫星：在弧外慢慢绕，给静止的圆盘一点「活物」 */
      #intro .it-sat {
        position: absolute;
        inset: 3%;
        border-radius: 50%;
        will-change: transform;
        animation: it-spin 13s linear infinite;
      }
      #intro .it-sat::before {
        content: '';
        position: absolute;
        left: 50%;
        top: 0;
        width: 4px;
        height: 4px;
        margin-left: -2px;
        border-radius: 50%;
        background: #1677ff;
        box-shadow: 0 0 12px rgba(22, 119, 255, 0.8);
      }
      #intro .it-sat.b {
        inset: 15%;
        animation-duration: 9s;
        animation-direction: reverse;
      }
      #intro .it-sat.b::before {
        background: #25d4ff;
        box-shadow: 0 0 12px rgba(37, 212, 255, 0.75);
      }

      /* ―― 中央标记：六边形 / 六节点 / Z 字标 ―― */
      #intro .it-glow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 46%;
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        /* 这里不要再挂 filter: blur()：.it-glow 在 .it-center 里，收口时整组
           会 transform 缩放，带 filter 的元素每帧都要重算一次高斯模糊，
           而它本身已经是一条 stops 到 transparent 的径向渐变，模糊在视觉上
           完全看不出来（实测 blur(6px) 峰值差 <0.5/255） */
        background: radial-gradient(closest-side, rgba(22, 119, 255, 0.14), rgba(22, 119, 255, 0.035) 55%, transparent);
      }
      #intro .it-spokes {
        opacity: 0;
        animation: it-in 0.52s ease 0.37s forwards;
      }
      #intro .it-spokes line {
        stroke: rgba(22, 119, 255, 0.16);
        stroke-width: 1;
      }
      /* 字标占舞台的比例从 74% 提到 86%：整枚标记（六边形 + Z + 六节点）
         放大一档，仍完整落在旋转刻度环之内；文字与进度线在舞台方框之下，
         不跟着变，也不会被挤到 */
      #intro .it-mark {
        position: relative;
        z-index: 2;
        width: 86%;
        height: 86%;
        overflow: visible;
      }
      #intro .it-mark .it-hex {
        fill: none;
        stroke: rgba(22, 119, 255, 0.4);
        stroke-width: 1.2;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: it-draw 0.78s cubic-bezier(0.5, 0.1, 0.3, 1) 0.09s forwards;
      }
      /* 沿着六边形跑一圈的亮段：把静态描边变成「有电流」 */
      #intro .it-mark .it-runner {
        fill: none;
        stroke: url(#itg);
        stroke-width: 1.5;
        stroke-dasharray: 9 91;
        stroke-dashoffset: 0;
        opacity: 0;
        animation:
          it-in 0.37s linear 0.78s forwards,
          it-run 1.92s linear 0.78s infinite;
      }
      #intro .it-mark .it-spoke {
        stroke: rgba(22, 119, 255, 0.18);
        stroke-width: 1;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: it-draw 0.67s ease-out 0.33s forwards;
      }
      #intro .it-mark .it-inner {
        fill: none;
        stroke: rgba(22, 119, 255, 0.12);
        stroke-width: 1;
        stroke-dasharray: 2 7;
        will-change: transform;
        animation: it-spin 34s linear infinite;
        transform-origin: 120px 120px;
      }
      /* Z 字标按品牌标记（/images/brand-mark.svg）的实际字形填充绘制：
         上横下垂一竖、下横上耸一竖、右上到左下一条粗斜笔，
         上横与斜笔之间还有一枚封闭的白色三角孔 —— 这些都不是描边能画的，
         所以字标本身改为实心 fill。
         落笔动效：mask 里五支笔刷按「上横 → 斜笔 → 下横 → 左竖 → 右竖」
         的顺序逐笔扫出（见 .it-z-brush），0.37s 起笔、1.45s 收笔。
         上一版只用“比笔画略宽”的笔刷控制边界：上横刷比字形底边多探出 0.4、
         下横刷比字形顶边多探出 2.15，于是左竖顶端、右竖底座会提前露出一条
         短竖 —— 那正是“Z 上多出来一点竖笔”。这一版给上横、下横各配一把
         剪刀（<defs> 里的 itClipTop / itClipBar），刀口正好压在横竖分界线上：
           · 上横的刀口压在 y=89.8（上横底边），左竖从这条线以下才开始；
           · 斜笔不裁（裁到 120.6 会多出十单位宽的台阶、裁到 133.8 会啃掉斜笔下端）；
         b4 / b5 各自的笔顺开始（1.11s / 1.29s）才揭开（Z 全程 0.37–1.09s
         两侧竖线不提前露出）。
         不再给字标挂 drop-shadow：模糊光晕叠在锐利字形上就是一圈「毛边」，
         而且它让被 mask 遮罩、每帧都在改 dashoffset 的元素整块重绘滤镜，
         首屏同时还在编译 3D 着色器，这一层就是卡顿的主要来源（光晕由
         舞台里的 .it-glow 提供，保持同样的观感）。 */
      #intro .it-mark .it-z {
        fill: url(#itg);
        fill-rule: evenodd;
      }
      /* 落笔墨刷一律用 butt 端头：起笔/收笔的截面是垂直于笔画的一条直线，
         起点又放在字标剪影之外，所以不会像圆头刷那样用半个圆先啃出字标
         的一角 —— 上一版 Z 起笔处的毛边就来自圆头刷与 drop-shadow 的叠加。
         笔刷宽度只保证盖满自己那条笔画，越界的那一点由上面三把刀剪掉。
         五笔在时间上首尾相接、每帧只有一支在动，避免一个 mask 里多条 dash
         同时重绘。 */
      #intro .it-mark .it-z-brush {
        fill: none;
        stroke: #fff;
        stroke-linecap: butt;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: it-draw 0.21s cubic-bezier(0.42, 0.05, 0.22, 1) 0.37s forwards;
      }
      /* b1 上横（y80–89.8） */
      #intro .it-mark .it-z-brush.b1 {
        stroke-width: 12;
      }
      /* b2 斜笔：右上起笔，笔尖落进下横左端（16.6：刚够盖住斜笔两侧与
         下横左角；再宽就会越过三角孔、把左竖融合段啃出来） */
      #intro .it-mark .it-z-brush.b2 {
        stroke-width: 16.6;
        animation-delay: 0.58s;
        animation-duration: 0.33s;
      }
      /* b3 下横（y147.7–160） */
      #intro .it-mark .it-z-brush.b3 {
        stroke-width: 13;
        animation-delay: 0.93s;
        animation-duration: 0.16s;
      }
      /* b4 左竖（x101.5–111.4） */
      #intro .it-mark .it-z-brush.b4 {
        stroke-width: 12;
        animation-delay: 1.11s;
        animation-duration: 0.16s;
      }
      /* b5 右竖（x127.4–138.4）：比字宽多留 0.7 的两侧余量 —— mask 在
         154px 的显示尺寸下只有 0.64px/单位，余量太小会被栅格化抹掉，
         竖笔右缘会被削掉半像素 */
      #intro .it-mark .it-z-brush.b5 {
        stroke-width: 12.4;
        animation-delay: 1.29s;
        animation-duration: 0.16s;
      }
      #intro .it-mark .it-node {
        fill: #1677ff;
        opacity: 0;
        transform: scale(0.2);
        transform-box: fill-box;
        transform-origin: center;
        animation: it-pop 0.38s cubic-bezier(0.2, 1.5, 0.4, 1) forwards;
      }
      #intro .it-mark .it-node.cyan {
        fill: #25d4ff;
      }

      /* ―― 字标 + 进度线 ―― */
      #intro .it-copy {
        margin-top: 34px;
        text-align: center;
        opacity: 0;
        animation: it-copy-in 0.46s cubic-bezier(0.22, 1, 0.36, 1) 0.83s forwards;

      /* 品牌两行整体上调三级（Tailwind 标尺）：
         天择科技 text-xl 20px → text-4xl 36px（xl→2xl→3xl→4xl），
         英文 10px → text-base 16px（10→xs 12→sm 14→base 16）。
         窄屏用 vw 回退，保证英文那行在 360 宽上也不顶到边框；
         字号放大后字距略收，仍是同一套疏排气质 */
      #intro .it-cn {
        font-size: clamp(30px, 9vw, 36px);
        font-weight: 700;
        letter-spacing: 0.2em;
        text-indent: 0.2em;
        color: #0b0f17;

      #intro .it-en {
        margin-top: 10px;
        font-size: clamp(13px, 4.2vw, 16px);

        text-indent: 0.24em;
        color: #1677ff;
      }
      #intro .it-track {
        position: relative;
        width: 148px;
        height: 2px;
        margin-top: 30px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(11, 15, 23, 0.07);
      }
      /* 进度线：只动 transform。上一版 keyframes 写的是 width 0→100%，
         那是布局属性 —— 每帧都要重新排版一次，浏览器主线程正好在同一段时间里
         解析入口 JS / 编译着色器，这条线就是最先抖起来的那个。改成定宽 +
         scaleX，整条动画交给合成线程 */
      #intro .it-track i {
        display: block;
        width: 100%;
        height: 100%;
        transform: scaleX(0);
        transform-origin: left center;
        border-radius: 999px;
        background: linear-gradient(90deg, #1677ff, #25d4ff);
        animation: it-fill 1.7s cubic-bezier(0.34, 0.62, 0.24, 1) 0.15s forwards;
      }
      /* 等 3D 就绪时的“还在干活”提示：进度条已经走满，但场景还没点亮。
         .it-wait 由脚本在进度条 animationend 且尚未收口时挂上，一条柔光
         沿着轨道往复扫过；只动 transform，不新增文案、不改变构图。 */
      #intro.it-wait .it-track::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 46%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, rgba(37, 212, 255, 0.9), transparent);
        animation: it-scan 1.25s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      @keyframes it-scan {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(330%);
        }
      }

      /* ―― 四角小字：只做信息密度，不做主角 ―― */
      #intro .it-meta {
        position: absolute;
        z-index: 3;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.22em;
        color: rgba(11, 15, 23, 0.32);
        opacity: 0;
        animation: it-in 0.41s ease 0.96s forwards;
      }
      #intro .it-meta.tl {
        left: 32px;
        top: 30px;
      }
      #intro .it-meta.tr {
        right: 32px;
        top: 30px;
        display: flex;
        align-items: center;
        gap: 8px;
        letter-spacing: 0.16em;
      }
      #intro .it-meta.tr i {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #1677ff;
        box-shadow: 0 0 10px rgba(22, 119, 255, 0.7);
        animation: it-beat 1.18s ease-in-out infinite;
      }
      #intro .it-meta.bl {
        left: 32px;
        bottom: 30px;
      }
      #intro .it-skip {
        position: absolute;
        right: 32px;
        bottom: 30px;
        z-index: 3;
        font-size: 11px;
        letter-spacing: 0.14em;
        color: rgba(11, 15, 23, 0.3);
        opacity: 0;
        animation: it-in 0.37s ease 1.11s forwards;
        transition: color 0.25s ease;
      }
      #intro .it-skip span {
        margin-left: 4px;
        color: rgba(22, 119, 255, 0.5);
      }
      #intro:hover .it-skip {
        color: rgba(11, 15, 23, 0.55);
      }

      /* ―― 收口：中央内容先淡出，随后六边形孔径从标记的轮廓处起跳，
         保持同样的六边形向外扩散到盖住四角，页面从形状里长出来 ――
         孔径的缩放改由 CSS 关键帧驱动（--it-cx / --it-cy / --it-s0 / --it-s1
         由收口脚本一次性量好写进 #intro），不再用 rAF 逐帧改 SVG 的 transform
         属性：那条循环每一帧都要拼字符串、标脏 mask 并强制重新栅格化，
         又正好撞上 React 挂载与着色器编译，是“动画卡一下再跳一格”的主要来源。
         现在合成线程自己跑，主线程忙也不影响节奏。
         it-gone 仍是兜底：孔径没跑起来时，白幕也会自己淡掉。 */
      #intro.it-open {
        pointer-events: none;
        animation: it-gone 0.22s linear 1.11s forwards;
      }
      #intro.it-open .it-bg,
      #intro.it-open .it-grid {
        opacity: 0;
      }
      /* 孔径与两条轮廓共用同一条缩放曲线；transform-box/view-box + 原点 0,0
         等价于原来 SVG 属性里的 translate(cx cy) scale(s)。
         只用 forwards、不用 both：延迟那 600ms 里必须停在标记自带的
         transform="scale(0)" 上（白幕完整不露底），到点才从轮廓尺寸起跳。
         轮廓同一帧起跳，但 opacity 从 0 渐亮，读作“轮廓亮起并外扩”，
         不会出现先在 scale(0) 处淡入再“啪”地跳到位 */
      #intro .it-hole,
      #intro .it-outline,
      #intro .it-outline-glow {
        transform-box: view-box;
        transform-origin: 0 0;
      }
      #intro.it-open .it-hole {
        animation: it-wipe 0.67s cubic-bezier(0.65, 0, 0.35, 1) 0.44s forwards;
      }
      #intro.it-open .it-outline {
        animation:
          it-wipe 0.67s cubic-bezier(0.65, 0, 0.35, 1) 0.44s forwards,
          it-line-in 0.22s ease 0.44s forwards,
          it-line-out 0.25s ease 1.11s forwards;
      }
      #intro.it-open .it-outline-glow {
        animation:
          it-wipe 0.67s cubic-bezier(0.65, 0, 0.35, 1) 0.44s forwards,
          it-line-in 0.3s ease 0.46s forwards,
          it-line-out 0.3s ease 1.08s forwards;
      }
      #intro.it-open .it-center {
        animation: it-center-out 0.44s cubic-bezier(0.4, 0, 0.7, 1) forwards;
      }
      #intro.it-open .it-meta,
      #intro.it-open .it-skip {
        animation: none;
        opacity: 0;
      }
      @keyframes it-wipe {
        from {
          transform: translate(var(--it-cx, 50vw), var(--it-cy, 50vh)) scale(var(--it-s0, 0.001));
        }
        to {
          transform: translate(var(--it-cx, 50vw), var(--it-cy, 50vh)) scale(var(--it-s1, 40));
        }
      }

      @keyframes it-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes it-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes it-run {
        to {
          stroke-dashoffset: -100;
        }
      }
      @keyframes it-in {
        to {
          opacity: 1;
        }
      }
      @keyframes it-pop {
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes it-copy-in {
        from {
          opacity: 0;
          transform: translateY(9px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes it-fill {
        to {
          transform: scaleX(1);
        }
      }
      @keyframes it-beat {
        0%,
        100% {
          opacity: 0.45;
          transform: scale(0.9);
        }
        50% {
          opacity: 1;
          transform: scale(1.15);
        }
      }
      /* 只动 opacity / transform。上一版这里还叠了 filter: blur(5px) ——
         整组（含被 mask 的字标）每帧都要重算一次高斯模糊，收口那 0.6s
         恰好是首屏刚开始绘制的时候，卡顿和“糊一下再揭开”的闪动都来自它 */
      @keyframes it-center-out {
        to {
          opacity: 0;
          transform: scale(1.06);
        }
      }
      @keyframes it-line-in {
        to {
          opacity: 1;
        }
      }
      @keyframes it-line-out {
        to {
          opacity: 0;
        }
      }
      @keyframes it-gone {
        to {
          opacity: 0;
        }
      }

      @media (max-width: 640px) {
        #intro .it-meta.tl,
        #intro .it-meta.tr {
          left: 20px;
          right: auto;
          top: 22px;
        }
        #intro .it-meta.tr {
          display: none;
        }
        #intro .it-meta.bl {
          display: none;
        }
        #intro .it-skip {
          right: 20px;
          bottom: 22px;
        }
      }
      /* 横屏手机 / 矮窗口：舞台按 45vh 算会顶到字标下面那三行，
         收一档尺寸并压紧字标与进度线的间距，保证整组竖着放得下 */
      @media (max-height: 520px) {
        #intro .it-stage {
          width: clamp(222px, min(56vw, 44vh), 340px);
        }
        #intro .it-copy {
          margin-top: 20px;
        }
        #intro .it-track {
          margin-top: 18px;
        }
      }
    </style>
    <!-- 开屏遮挡页只在官网首页演：后台、内页、后台预览 iframe 与「减弱动效」
         一律打 data-intro-off，由 CSS 直接关掉 —— 登录页/内页不该被一层白幕
         挡在门外。判定放这里是为了赶在首次绘制之前，连一帧白幕都不闪。 -->
    <script>
      if (
        location.pathname !== '/' ||
        /[?&]admin_preview=1\b/.test(location.search) ||
        window.matchMedia('(prefers-reduced-motion: reduce)').matches
      ) {
        document.documentElement.dataset.introOff = '1'

    </script>
    <!-- 管理后台是亮色壳（bg-mist-100），但上面为官网 3D 首屏把 html 底色钉成了近黑 #04070d；
         直接开 /admin 时 React 尚未挂载，会先闪一片黑。这里在首次绘制前用同步内联脚本
         把 html 底色改回加载后的亮色 #f7f8fa（与后台加载完成后的背景一致）。 -->
    <script>
      if (/^\/admin(?:\/|$)/.test(location.pathname)) {
        document.documentElement.style.background = '#f7f8fa'
        document.documentElement.style.colorScheme = 'light'
        /* 同步打标：让 index.css 里 `html[data-admin] body` 在首次绘制前就把 body 留在亮底，
           否则刚把官网底色钉成 night、/admin 反而会闪一片暗 */
        document.documentElement.dataset.admin = '1'
      }
    </script>

    <noscript>

    <!-- loading 角标本体：一枚内联六边形（与 favicon 同一张画）加一句话，不加一个请求。
         收掉它的是 main.jsx，时机是「首屏舞台真的在画」（过了着色器编译那一帧），
         不是「React 画完第一帧」—— 那会儿 3D 还在路上；也不等模型下载，

    <div id="boot" role="status" aria-live="polite">

    <!-- 开屏遮挡页本体：纯内联，无图片、无字体、无请求。
         中央六边形是品牌徽标轮廓（节点依次点亮），Z 字标最后落笔；
         收口动作看下面那段脚本：孔径从标记自身的六边形轮廓起跳，

    <div id="intro" aria-hidden="true">
      <!-- 白幕本体：一整块白 rect，mask 里用一枚可缩放的黑六边形挖孔。

           六边形尺寸，再保持形状放大。描边跟着孔走，读作「轮廓向外扩散」。 -->
      <svg class="it-wipe" aria-hidden="true" focusable="false">
        <defs>
          <mask
            id="itHole"
            maskUnits="userSpaceOnUse"
            maskContentUnits="userSpaceOnUse"
            x="0"
            y="0"
            width="100%"
            height="100%"
          >
            <rect x="0" y="0" width="100%" height="100%" fill="#fff" />
            <path
              class="it-hole"
              d="M0 -62 L53.7 -31 L53.7 31 L0 62 L-53.7 31 L-53.7 -31 Z"
              fill="#000"
              transform="scale(0)"
            />
          </mask>
          <linearGradient id="itEdge" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#1677FF" stop-opacity="0.62" />

      <div class="it-bg"></div>

      <div class="it-center">
        <div class="it-stage">
          <div class="it-ticks"></div>
          <div class="it-sat"></div>
          <div class="it-sat b"></div>
          <div class="it-arc"></div>

          <div class="it-glow"></div>
          <svg class="it-mark" viewBox="0 0 240 240" aria-hidden="true">
            <defs>
              <linearGradient id="itg" x1="34" y1="24" x2="206" y2="216" gradientUnits="userSpaceOnUse">
                <stop stop-color="#1677FF" />
                <stop offset="0.52" stop-color="#4FA9FF" />
                <stop offset="1" stop-color="#25D4FF" />
              </linearGradient>
              <!-- 字标的“落笔”笔刷：五支白色平头笔按书写顺序扫过 ——
                   上横、斜笔、下横、左竖、右竖。起笔点都在字标剪影之外，
                   笔画进入字形时截面已是干净的直线，不会啃出圆弧毛边。
                   坐标按 240×240 viewBox 里的字形轮廓量出来：
                   上横 y84.9、下横 y153.85、左竖 x106.45、右竖 x132.9。
                   两把刀只裁 Z 的上横和下横（斜笔不裁），把不属于它们的竖笔区域剪掉；
                   左竖、右竖两笔不裁（它们的笔刷本来就只覆盖自己那一列）。 -->
              <clipPath id="itClipTop" clipPathUnits="userSpaceOnUse">
                <!-- 刀口压在上横底边 y=89.8：以下属于左竖，等 b4 揭开 -->
                <rect x="87.4" y="0" width="65.4" height="89.8" />
              </clipPath>
              <clipPath id="itClipBar" clipPathUnits="userSpaceOnUse">
                <!-- 刀口压在下横顶边 y=147.7：以上属于右竖底座，等 b5 揭开 -->
                <rect x="0" y="147.7" width="240" height="92.3" />
              </clipPath>
              <mask id="itZBrush" maskUnits="userSpaceOnUse" x="0" y="0" width="240" height="240">
                <rect x="0" y="0" width="240" height="240" fill="#000" />
                <g clip-path="url(#itClipTop)">
                  <path class="it-z-brush b1" pathLength="100" d="M87.8 84.9 H152.2" />

                <g clip-path="url(#itClipBar)">
                  <path class="it-z-brush b3" pathLength="100" d="M87.8 153.85 H152.2" />

                <path class="it-z-brush b5" pathLength="100" d="M132.9 119.9 V148.6" />

              <line x1="120" y1="120" x2="66.3" y2="151" />
              <line x1="120" y1="120" x2="66.3" y2="89" />

              class="it-hex"
              pathLength="100"

              class="it-runner"

            <!-- Z 字标＝品牌标记的真实字形（public/images/brand-mark.svg）：
                 外轮廓 15 点 + 上横与斜笔之间那枚封闭三角孔，
                 整体按 logo 的 100×130 比例缩放后居中放进六边形。 -->
            <path
              class="it-z"
              mask="url(#itZBrush)"
              d="M89.2 80 H150.8 V93.5 L103.4 147.7 H127.4 V132.3 L138.4 120 V147.7 H150.8 V160 H89.2 V147.7 L101.5 132.9 V89.8 H89.2 Z M111.4 89.8 H137.2 L111.4 120.6 Z"
            />
            <circle class="it-node" cx="120" cy="58" r="3.2" style="animation-delay: 0.44s" />
            <circle class="it-node" cx="173.7" cy="89" r="3.2" style="animation-delay: 0.5s" />
            <circle class="it-node cyan" cx="173.7" cy="151" r="3.2" style="animation-delay: 0.56s" />
            <circle class="it-node" cx="120" cy="182" r="3.2" style="animation-delay: 0.62s" />
            <circle class="it-node cyan" cx="66.3" cy="151" r="3.2" style="animation-delay: 0.68s" />
            <circle class="it-node" cx="66.3" cy="89" r="3.2" style="animation-delay: 0.74s" />

      <div class="it-meta bl">INFRASTRUCTURE FOR FUTURE TALENT</div>
      <div class="it-skip">跳过<span>›</span></div>
    </div>
    <script>
      /* ―― 开屏遮挡页的收口控制 ――
         时间轴改成“跟着画面走”，不再自己掐表：
         1) Z 最后一笔落完（b5 的 animationend，约 1.45s）→ 派发 tz:draw-end，
            StoryHero 收到后才开始取 3D；
         2) 遮罩保持完整，等舞台的“真就绪”信号（首帧已画 + 全部 GL program
            链接成功 + 主线程空闲一拍，见 HeroStage 的 StageReady）；
         3) 等待期间进度条走满后切到不定量柔光扫描（.it-wait），不新增文案；
         4) 兜底：HARD_MS 内没等到就照原时间轴掀开；3D 报错/无 WebGL/无舞台
            同样立即放行；手势跳过（ARMED 之后）永远有效，不受等待影响。
         用户路径：滚轮/触摸/按键/点击 —— 事件被 capture 拦下并 preventDefault，
         避免 Lenis 把页面先滚走半屏。 */
      (function () {
        var intro = document.getElementById('intro')
        if (!intro) return
        if (document.documentElement.dataset.introOff) {
          intro.parentNode && intro.parentNode.removeChild(intro)
          return
        }

        var T_MIN = 1740
        var ARMED = 666
        /* 等 3D 就绪的硬上限：从开屏脚本开始算 5.2s（落笔 1.45s + 挂载/下载/
           编译各留余量）。到点无论 3D 在干什么都掀开，别把人关在门外。 */
        var HARD_MS = 5200
        var t0 = performance.now()
        var done = false
        var timer = 0

        /* 量测用时间轴：drawEnd / stageStart / heroReady / apertureStart /
           curtainGone 全部是 performance.now() 的绝对值，方便和 FPS 采样对齐 */
        var T = (window.__tzT = window.__tzT || {})
        T.t0 = t0
        function at() {
          return Math.round(performance.now())
        }

        function unlock() {
          window.removeEventListener('wheel', onGesture, true)
          window.removeEventListener('touchmove', onGesture, true)
          window.removeEventListener('keydown', onGesture, true)
        }

        function exit(reason) {
          if (done) return
          done = true
          clearTimeout(timer)
          clearTimeout(deadline)
          intro.classList.remove('it-wait')
          /* 先量几何再上 it-open：此刻中央内容还没开始放大，量出来的
             六边形位置/尺寸才和屏幕上那枚对齐 */
          runWipe()
          intro.classList.add('it-open')
          /* 给量测脚本留一个「白幕演了多久 / 从哪条出口走的」的凭据 */
          T.apertureStart = at()
          window.__introExitAt = Math.round(performance.now() - t0)
          window.__introExitReason = reason
          unlock()
          setTimeout(function () {
            intro.parentNode && intro.parentNode.removeChild(intro)
            T.curtainGone = at()
          }, 1332)
        }

        /* 六边形扩散：孔径不是从小圆点开始的，而是从中央那枚六边形自身的
           轮廓处起跳，保持六边形形状放大到盖住四角。
           白幕 rect 的 mask 里放了一枚黑六边形，缩到多大，页面就从多大的
           六边形里露出来；描边两条跟它同步，读作“轮廓在向外扩散”。
           这里只量一次几何、把四个值写进 #intro 的 CSS 变量，补间交给
           it-wipe 关键帧在 CSS 时间轴上跑 —— 不再在这个回调里逐帧拼字符串、
           改 SVG 属性和 mask。起点留 600ms 让中央内容先淡出，再让轮廓接上
           （与 CSS 里的延迟一致）。 */
        function runWipe() {
          var mark = intro.querySelector('.it-mark')
          var mr = mark.getBoundingClientRect()
          var w = window.innerWidth
          var h = window.innerHeight
          var cx = mr.left + mr.width / 2
          var cy = mr.top + mr.height / 2
          /* 标记 viewBox 是 240，六边形半径 62：s0 让孔径正好落在画出来的轮廓上 */
          var s0 = mr.width / 240
          /* 尖朝上的六边形：点 (ax,ay) 在内部的条件是 ay + ax/√3 ≤ R 且 ax ≤ .866R */
          function reach(x, y) {
            var ax = Math.abs(x - cx)
            var ay = Math.abs(y - cy)
            return Math.max(ay + ax / 1.732, ax / 0.866)
          }
          var R = Math.max(reach(0, 0), reach(w, 0), reach(0, h), reach(w, h)) * 1.06
          var s1 = R / 62
          intro.style.setProperty('--it-cx', cx.toFixed(1) + 'px')
          intro.style.setProperty('--it-cy', cy.toFixed(1) + 'px')
          intro.style.setProperty('--it-s0', s0.toFixed(4))
          intro.style.setProperty('--it-s1', s1.toFixed(4))
        }

        /* 收到“舞台真就绪”（或明确的“没有 3D 可等”：nostage / dead / inner）
           之后，补足最短展示时间 T_MIN 再掀：就绪得早也不能让开屏一闪而过。 */
        function ready(reason) {
          if (done) return
          T.ready = at()
          T.readyReason = reason
          clearTimeout(deadline)
          var wait = T_MIN - (performance.now() - t0)
          if (wait > 0) {
            clearTimeout(timer)
            timer = setTimeout(function () {
              timer = 0
              exit(reason)
            }, wait)
            return
          }
          exit(reason)
        }

        /* main.jsx 在首屏就绪时调进来；user = 用户手势，立刻走，不等 T_MIN */
        window.__introExit = function (reason) {
          var r = reason || 'hero'
          if (r === 'user') {
            exit('skip')
            return
          }
          ready(r)
        }

        /* 硬兜底：到点没等到就绪，照原时间轴掀开。5100ms 之后主线程上要等的
           东西都已经等过了；继续挂着只会让“没冻住”变成“真的卡住了”。 */
        var deadline = setTimeout(function () {
          if (done) return
          T.fallback = at()
          exit('fallback')
        }, HARD_MS)

        /* ―― 落笔结束 → 通知 StoryHero 挂 3D ――
           b5 是 Z 的最后一笔（1.29s 起笔 + 0.16s）。用 animationend 而不是
           再写一个 1450ms：动画的时长/延迟改了，3D 的启动点会自己跟上。
           __tzDrawEnd 同时置真，防止模块脚本比动画晚到、错过这一次事件。 */
        var brush = intro.querySelector('.it-z-brush.b5')
        function drawDone(e) {
          if (e && e.animationName !== 'it-draw') return
          brush.removeEventListener('animationend', drawDone)
          T.drawEnd = at()
          window.__tzDrawEnd = true
          var ev
          try {
            ev = new CustomEvent('tz:draw-end', { detail: { at: T.drawEnd } })
          } catch (_) {
            ev = document.createEvent('Event')
            ev.initEvent('tz:draw-end', false, false)
          }
          window.dispatchEvent(ev)
        }
        if (brush) brush.addEventListener('animationend', drawDone)

        /* 进度条走满而遮罩还没收：切到不定量扫描，别让等待看起来像冻住 */
        var bar = intro.querySelector('.it-track i')
        if (bar)
          bar.addEventListener('animationend', function (e) {
            if (e.animationName !== 'it-fill' || done) return
            intro.classList.add('it-wait')
          })

        function onGesture(e) {
          if (done) return
          if (e.type === 'keydown' && !/^(Arrow|Page|Home|End| )/.test(e.key)) return
          e.preventDefault()
          e.stopPropagation()
          if (performance.now() - t0 >= ARMED) exit('skip')
        }

        window.addEventListener('wheel', onGesture, { passive: false, capture: true })
        window.addEventListener('touchmove', onGesture, { passive: false, capture: true })
        window.addEventListener('keydown', onGesture, true)
        intro.addEventListener('pointerdown', function () {
          if (!done && performance.now() - t0 >= ARMED) exit('skip')
        })
      })()
    </script>
    <script>
      setTimeout(function () {
        var b = document.getElementById('boot')
        if (b && !b.className) b.classList.add('boot-gone')
      }, 9000)
    </script>
    <script type="module" src="/src/main.jsx"></script>
