      <text x="800" y="452" font-family="'Songti SC','STSong','Noto Serif SC','Source Han Serif SC','SimSun',serif" font-size="74" font-weight="700" fill="#171717" text-anchor="middle" letter-spacing="2" opacity="1">深圳市天择教育科技有限公司</text>
      <text x="800" y="510" font-family="'Songti SC','STSong','Noto Serif SC','Source Han Serif SC','SimSun',serif" font-size="27" font-weight="400" fill="#3f3f3f" text-anchor="middle" letter-spacing="0" opacity="1">注册地址：深圳市南山区粤海街道科园路软件产业基地5栋E座701</text>
      <text x="800" y="588" font-family="'Songti SC','STSong','Noto Serif SC','Source Han Serif SC','SimSun',serif" font-size="28" font-weight="400" fill="#2f2f2f" text-anchor="middle" letter-spacing="0" opacity="1">针对企业的企业素质、经营水平、外部环境、财务状况、发展前景、以及可能出现的各种风险，</text>
      <text x="800" y="636" font-family="'Songti SC','STSong','Noto Serif SC','Source Han Serif SC','SimSun',serif" font-size="28" font-weight="400" fill="#2f2f2f" text-anchor="middle" letter-spacing="0" opacity="1">结合行业现状及行业政策对其信用状况进行客观、科学、公正的评估确定该企业信用等级为：</text>
      <text x="800" y="800" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="196" font-weight="700" fill="#c2451c" text-anchor="middle" letter-spacing="30" opacity="1">AAA</text>
      <text x="800" y="874" font-family="'Songti SC','STSong','Noto Serif SC','Source Han Serif SC','SimSun',serif" font-size="32" font-weight="400" fill="#2b2b2b" text-anchor="middle" letter-spacing="0" opacity="1">评级目的：投标、商务洽谈</text>
      <text x="400" y="930" font-family="'Songti SC','STSong','Noto Serif SC','Source Han Serif SC','SimSun',serif" font-size="25" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="0" opacity="1">证书编号：CPED-SA30413</text>
      <text x="400" y="966" font-family="'Songti SC','STSong','Noto Serif SC','Source Han Serif SC','SimSun',serif" font-size="25" font-weight="400" fill="#3a3a3a" text-anchor="start" letter-spacing="0" opacity="1">有效期：2017.12—2019.12</text>
