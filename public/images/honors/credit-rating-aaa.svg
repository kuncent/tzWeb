      <text x="800" y="286" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="30" font-weight="600" fill="#7b5a36" text-anchor="middle" letter-spacing="8" opacity="1">CERTIFICATE OF CREDIF GRADE</text>
