    <!-- 字体改异步：原来那行 <link rel="stylesheet"> 是渲染阻塞资源，而
         fonts.googleapis.com 在境内网络上经常要等到 TCP 超时才死心 —— 浏览器
         就在那段时间里什么都不画。实测（tmp/boot-perf.mjs，本地）：把这两个域
         断掉，first-paint 688ms → 152ms、FCP 1856ms → 1288ms。
         media="print" + onload 升回 all：能拿到 Inter 就换上去（display=swap
         已经写了，不会隐形），拿不到就用系统中文黑体往下排 —— 反正那排字
         本来就是 Inter 缺席时的样子，不会变丑，只会快 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>
      /* ―― 首屏 loading 角标：只标「舞台还没在画」，不挡页面 ――
         为什么内联在这里而不是做一个 React 组件：要盖的正是「React 自己的第一帧」
         （入口 JS 的解析 + 首次提交），挂在 React 里就等于让 loading 等自己。
         零依赖、零请求：进 HTML 就已在屏上。
         为什么不是全屏黑幕（上一版是）：黑幕把已经加载好的导航、大标题、看板一起
         盖掉了 —— 而用户要的是「页面先出来，只有那块 3D 舞台在加载」。所以这是一枚
         不占排版的胶囊：pointer-events:none，页面从头到尾可读可点。
         字体不写 Inter（它还在路上），直接用系统里就在的那一档 */
      html {
        background: #06080d;
        /* 声明暗色 color-scheme：让浏览器在样式表/布局之前的最早那一帧就把
           默认画布选成暗色，而不先铺一层白——与上面的暗底一起把“白屏闪过”彻底堵掉 */
        color-scheme: dark;
      }
      #boot {
        position: fixed;
        left: 50%;
        bottom: 15%;
        transform: translateX(-50%);
        z-index: 2147483000;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 18px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        background: rgba(6, 8, 13, 0.62);
        color: rgba(255, 255, 255, 0.72);
        pointer-events: none;
        font-family: 'HarmonyOS Sans SC', 'Source Han Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        transition: opacity 0.55s ease 0.05s;
      }
      #boot.boot-gone {
        opacity: 0;
      }
      /* 进度条是不确定的（真的不知道还要多久，骗人的百分比比不给更糟）：
         一段亮条在胶囊底边 2px 轨道上来回扫，读作“在做事”而不是“卡在 30%” */
      #boot .bt-bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 2px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.09);
      }
      #boot .bt-bar i {
        position: absolute;
        inset: 0 auto 0 0;
        width: 42%;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, #1677ff 45%, #6ec6ff);
        animation: bt-sweep 1.25s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      #boot .bt-tip {
        font-size: 12px;
        letter-spacing: 0.05em;
        white-space: nowrap;
      }
      @keyframes bt-sweep {
        0% {
          transform: translateX(-105%);
        }
        100% {
          transform: translateX(245%);
        }
      }
      /* 要求减弱动效的人：给静帧，不要拿着一条来回扫的亮条 */
      @media (prefers-reduced-motion: reduce) {
        #boot .bt-bar i {
          width: 100%;
          animation: none;
          transform: none;
          opacity: 0.5;
        }
      }
    </style>
    <!-- 管理后台是亮色壳（bg-mist-100），但上面为官网 3D 首屏把 html 底色钉成了近黑 #04070d；
         直接开 /admin 时 React 尚未挂载，会先闪一片黑。这里在首次绘制前用同步内联脚本
         把 html 底色改回加载后的亮色 #f7f8fa（与后台加载完成后的背景一致）。 -->
    <script>
      if (/^\/admin(?:\/|$)/.test(location.pathname)) {
        document.documentElement.style.background = '#f7f8fa'
        document.documentElement.style.colorScheme = 'light'
        /* 同步打标：让 index.css 里 `html[data-admin] body` 在首次绘制前就把 body 留在亮底，
           否则刚把官网底色钉成 night、/admin 反而会闪一片暗 */
        document.documentElement.dataset.admin = '1'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- 无 JS / 不执行脚本的爬虫兜底：本项目首屏走 React.lazy，服务端 index.html 里
         本来没有 <main>/<h1>，GEO 侧不执行 JS 的检索引擎（部分 AI 爬虫）就抓不到语义
         骨架。这里放一份纯静态标题 + 主叙述（有 JS 时浏览器会忽略 <noscript> 内容，
         不影响 React 挂载），既补上语义层级，也让关 JS 的场景有个可读的落地页。 -->
    <noscript>
      <main>
        <h1>天择未来教育 · 下一代人才培养基础设施</h1>

        <p>一句话或一份大纲，几分钟生成一堂完整的 AI 多智能体互动课堂，并把自然语言需求直接生成可运行的实验代码，在云端沙箱自动评测。</p>
        <p>联系邮箱：<a href="mailto:contact@sztzjy.com">contact@sztzjy.com</a>　官网：<a href="https://www.sztzjy.com/">https://www.sztzjy.com</a></p>
      </main>
    </noscript>
    <!-- loading 角标本体：一枚内联六边形（与 favicon 同一张画）加一句话，不加一个请求。
         收掉它的是 main.jsx，时机是「首屏舞台真的在画」（过了着色器编译那一帧），
         不是「React 画完第一帧」—— 那会儿 3D 还在路上；也不等模型下载，
         那是用户看不见的一跳。不挂 3D 的设备、用户先动手、舞台进错误边界、
         带 hash 直达别的板块都是立刻收的出口；下面这个定时器只是
         兜底 —— 入口 JS 挂了也不该让角标一直挂在那儿 -->
    <div id="boot" role="status" aria-live="polite">
      <svg width="16" height="16" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="bootg" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
            <stop stop-color="#65BFFF" />
            <stop offset="1" stop-color="#1677FF" />
          </linearGradient>
        </defs>
        <rect x="1" y="1" width="30" height="30" rx="9" fill="url(#bootg)" />
        <path d="M10 22.5L15.6 16L21.5 10.2" stroke="#fff" stroke-opacity="0.6" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="10" cy="22.5" r="2.1" fill="#fff" fill-opacity="0.85" />
        <circle cx="15.6" cy="16" r="2.5" fill="#fff" fill-opacity="0.95" />
        <circle cx="21.5" cy="10.2" r="3.8" fill="#fff" />
      </svg>
      <span class="bt-tip">正在装配实验室…</span>
      <span class="bt-bar"><i></i></span>
    </div>
    <script>
      setTimeout(function () {
        var b = document.getElementById('boot')
        if (b && !b.className) b.classList.add('boot-gone')
      }, 9000)
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
